name: Windows Release CI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PI_CHAT_RELEASE_MODE: "1"
  PI_CHAT_RELEASE_TAG: ${{ github.ref_name }}
  PI_CHAT_BUILD_REVISION: ${{ github.sha }}

jobs:
  verify-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Prepare checksum-pinned installer inputs
        run: npm run setup:inputs
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:type-debt
      - run: npm run check:writer-boundaries
      - run: npm run verify:unit
      - run: npm run verify:e2e
      - name: Verify release artifact
        env:
          PI_CHAT_RELEASE_MODE: "0"
          PI_CHAT_RELEASE_TAG: ""
          PI_CHAT_BUILD_REVISION: ""
        run: npm run verify:artifact
      - name: Verify self-contained Windows install and uninstall
        env:
          PI_CHAT_RELEASE_MODE: "0"
          PI_CHAT_RELEASE_TAG: ""
        run: npm run test:setup
      - name: Build and package release candidate
        shell: pwsh
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $nodeTemp = (node -e "process.stdout.write(require('node:os').tmpdir())").TrimEnd('\')
          $stage = Join-Path $nodeTemp "pi-chat-release-dist"
          $output = Join-Path $nodeTemp "pi-chat-release-output"
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $output -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage, $output | Out-Null
          $env:PI_CHAT_DIST_DIR = $stage
          npm run build
          $env:PI_CHAT_RELEASE_MODE = "0"
          Remove-Item Env:PI_CHAT_RELEASE_TAG -ErrorAction SilentlyContinue
          Remove-Item Env:PI_CHAT_BUILD_REVISION -ErrorAction SilentlyContinue
          npm run test:artifact
          $env:PI_CHAT_RELEASE_MODE = "1"
          $env:PI_CHAT_RELEASE_TAG = $env:GITHUB_REF_NAME
          $env:PI_CHAT_BUILD_REVISION = $env:GITHUB_SHA
          node scripts/release-package.mjs --staging $stage --output $output --tag $env:PI_CHAT_RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Setup packaging failed" }
          $setup = Get-Item -LiteralPath (Join-Path $output "pi-chat-setup.exe")
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $record = (Get-Content -LiteralPath "$($setup.FullName).sha256" -Raw).Trim()
          if ($record -ne "$hash *$($setup.Name)") { throw "Setup checksum mismatch" }
          $manifest = Get-Content -LiteralPath "$($setup.FullName).manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.tag -ne $env:PI_CHAT_RELEASE_TAG) { throw "Manifest tag does not match the pushed tag" }
          if ($manifest.revision -ne $env:GITHUB_SHA) { throw "Manifest revision does not match the pushed commit" }
          if ($manifest.setup.sha256 -ne $hash) { throw "Manifest checksum does not match the Setup" }
          if (@(Get-ChildItem -LiteralPath $output -File).Count -ne 3) { throw "Expected one Setup and two sidecars only" }
      - name: Upload verified release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pi-chat-windows-${{ github.ref_name }}-verified
          path: ${{ runner.temp }}/pi-chat-release-output/*
          if-no-files-found: error
      - name: Publish verified GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $output = Join-Path $env:RUNNER_TEMP "pi-chat-release-output"
          $assets = @('pi-chat-setup.exe', 'pi-chat-setup.exe.sha256', 'pi-chat-setup.exe.manifest.json') | ForEach-Object { (Get-Item -LiteralPath (Join-Path $output $_)).FullName }
          if (-not $assets) { throw "No verified release assets were produced" }
          $notes = Join-Path $env:GITHUB_WORKSPACE "release-notes-$tag.md"
          if (Test-Path -LiteralPath $notes) {
            $notesArgs = @('--notes-file', $notes)
          } else {
            $notesArgs = @('--generate-notes')
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release already exists; published assets are immutable. Use a new tag."
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --title "Pi Chat $tag" --draft=false --prerelease=false @notesArgs @assets
          }
