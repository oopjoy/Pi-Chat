name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm run verify:unit
        env:
          PI_CHAT_BUILD_REVISION: ${{ github.sha }}
      - run: npm run verify:e2e
        env:
          PI_CHAT_BUILD_REVISION: ${{ github.sha }}
      - name: Verify staged release artifact
        run: npm run verify:artifact
        env:
          PI_CHAT_BUILD_REVISION: ${{ github.sha }}
      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - name: Check push diff
        if: github.event_name == 'push' && github.event.deleted != true
        shell: pwsh
        env:
          PI_CHAT_REF_TYPE: ${{ github.ref_type }}
          PI_CHAT_EVENT_DELETED: ${{ github.event.deleted }}
        run: |
          $before = "${{ github.event.before }}"
          $head = "${{ github.sha }}"
          $refType = "${env:PI_CHAT_REF_TYPE}"
          $beforeCommit = $null
          if ($before -notmatch '^0+$') {
            $beforeCommit = git rev-parse --verify "$before^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              $beforeCommit = $null
            }
          }
          if ($refType -eq 'branch') {
            if ($before -match '^0+$') {
              git show --check --format= $head
            } elseif (-not $beforeCommit) {
              throw "Cannot resolve github.event.before for a branch push; refusing to check only the tip commit."
            } else {
              git diff --check $beforeCommit $head
            }
          } elseif ($refType -eq 'tag') {
            if ($beforeCommit) {
              git diff --check $beforeCommit $head
            } else {
              # Tag creation/forced updates may have no trustworthy diff base.
              # Check the commit patch and every committed LF-governed blob.
              git show --check --format= $head
              node scripts/check-committed-text.mjs --all
            }
          } else {
            throw "Unsupported push ref type: $refType"
          }
      - name: Check committed text line endings
        if: github.event_name != 'push' || github.event.deleted != true
        run: node scripts/check-committed-text.mjs --all
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
